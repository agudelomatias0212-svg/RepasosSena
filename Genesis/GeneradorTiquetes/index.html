<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiquetes - Proyecto Genesis</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <aside>

        <h1>Generador de tiquetes</h1>
        <p>Pega el texto de amadeus para generar la presentacion del tiquete</p>
        
        <textarea name="Tiquete" id="entrada" placeholder="Pega aqui el texto de amadeus"></textarea>

        <label for="equipaje">Equipaje de mano - ingresa solo el numero de piezas (se completa el texto automaticamente)</label>
        <input type="number" id="equipaje" name="equipaje" placeholder="Ej: 1">

        <button class="btn" id="generar">Generar presentacion</button>
        <button class="btn" id="descargar">Descargar PDF</button>
        <button class="btn" id="limpiar">Limpiar</button>

    </aside>

    <main>
        <p>Pega el texto IED de amadeus, y presiona "Generar presentacion" para ver la vista previa del documento aqui.</p>
    </main>


</body>
    
</html>
